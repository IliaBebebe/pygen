server {
    server_name pygen.rexcorp.space;
    root /var/www/rexcorp/public;
    index index.html;

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/rexcorp.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rexcorp.space/privkey.pem;

    access_log /var/log/nginx/pygen.rexcorp.access.log;
    error_log /var/log/nginx/pygen.rexcorp.error.log;

    include /etc/nginx/snippets/rexcorp-deny-dotfiles.conf;
    include /etc/nginx/snippets/rexcorp-security-headers.conf;

    location = /GIT_WORKFLOW.md {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
