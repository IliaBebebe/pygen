server {
    server_name pygen.rexcorp.space;
    root /var/www/rexcorp/public/pygen;
    index index.html;

    access_log /var/log/nginx/pygen.rexcorp.access.log;
    error_log /var/log/nginx/pygen.rexcorp.error.log;

    include /etc/nginx/snippets/rexcorp-deny-dotfiles.conf;
    include /etc/nginx/snippets/rexcorp-security-headers.conf;

    location = /GIT_WORKFLOW.md {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rexcorp.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rexcorp.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name pygen.rexcorp.space;
    return 301 https://pygen.rexcorp.space$request_uri;
}
